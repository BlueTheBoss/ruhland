general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 5
    ignore_empty_input = true
}

background {
    path = {{image.path}}
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    inner_color = rgb({{colors.surface.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    fade_on_empty = true
    fade_timeout = 3000
    placeholder_text = Password...
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%I:%M %p')"
    color = rgb({{colors.on_surface.default.hex_stripped}})
    font_size = 72
    font_family = Google Sans Flex
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:86400000] echo "$(date '+%A, %B %d')"
    color = rgb({{colors.on_surface_variant.default.hex_stripped}})
    font_size = 20
    font_family = Google Sans Flex
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = Ruhland
    color = rgb({{colors.outline.default.hex_stripped}})
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}
